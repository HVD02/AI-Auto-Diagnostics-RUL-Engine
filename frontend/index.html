<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <title>AI Auto-Diagnostics &amp; RUL Engine</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("autoDiagTheme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      html[data-theme="dark"] { background: #101219; }
      html[data-theme="light"] { background: #f5f1e8; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
